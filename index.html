<!doctype html>
<html lang="zh-CN" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/orbit-music-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" href="/orbit-music-icon.png" />
    <title>Orbit Music</title>
    <script>
      (() => {
        try {
          const key = 'theme'
          const stored = localStorage.getItem(key)
          const theme =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system'
          const dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)

          const legacyMap = {
            red: '#ef4444',
            rose: '#f43f5e',
            orange: '#f97316',
            amber: '#f59e0b',
            emerald: '#10b981',
            teal: '#14b8a6',
            sky: '#0ea5e9',
            blue: '#3b82f6',
            indigo: '#6366f1',
            violet: '#8b5cf6',
          }
          let color = localStorage.getItem('bound-music.accent-color')
          if (!color || !/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(color)) {
            const legacy = localStorage.getItem('bound-music.accent')
            color = (legacy && legacyMap[legacy]) || '#ef4444'
          }
          if (/^#([0-9a-f]{3})$/i.test(color)) {
            const s = color.slice(1)
            color = '#' + s[0] + s[0] + s[1] + s[1] + s[2] + s[2]
          }
          const r = parseInt(color.slice(1, 3), 16) / 255
          const g = parseInt(color.slice(3, 5), 16) / 255
          const b = parseInt(color.slice(5, 7), 16) / 255
          const lin = (c) =>
            c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)
          const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b)
          const fg = L > 0.45 ? '#0a0a0a' : '#ffffff'
          document.documentElement.style.setProperty('--brand', color)
          document.documentElement.style.setProperty('--brand-foreground', fg)
          delete document.documentElement.dataset.accent
        } catch {}
      })()
    </script>
  </head>
  <body class="overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
