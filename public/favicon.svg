<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <rect width="128" height="128" rx="28" fill="#0A0A0A"/>
  <!-- orbit ring -->
  <ellipse
    cx="64"
    cy="64"
    rx="44"
    ry="18"
    transform="rotate(-38 64 64)"
    stroke="#FAFAFA"
    stroke-width="5.5"
    stroke-linecap="round"
  />
  <!-- note head -->
  <ellipse cx="50" cy="82" rx="16" ry="12" transform="rotate(-18 50 82)" fill="#FAFAFA"/>
  <!-- note stem -->
  <path
    d="M64 78 V34 C64 34 78 36 86 42 C78 40 70 40 66 44 V78 Z"
